<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Formulario de inscrição</h1>
    <form>
        <label for="nome">Nome:</label>
        <br>
        <input type="text" for="nome" required>
        <br><br>

        <label for="email">Email:</label>
        <br>
        <input type="email" required for="email">
        <br><br>

        <label for="whatsApp">whatsApp</label>
        <br>
        <input type="tel" for="whatsApp" required>
        <br><br>

        <label for="atuacao">Area de atuação</label>
        <br>
        <input type="radio" name="Area" required id="desenvolvimento">
        <label for="desenvolvimento">Desenvolvimento</label>
        <input type="radio" name="Area" id="QA">
        <label for="QA">Quality Assurance (QA)</label>
        <input type="radio" name="Area" id="analise">
        <label for="analise">Análise de Dados</label>
        <input type="radio" name="Area" id="infra">
        <label for="infra">Infraestrutura</label>
        <br><br>

        <label for="observacoes">Observações</label>
        <br>
        <textarea name="observacoes" id="obs" cols="40" rows="4"></textarea>
        <br><br>

        <input type="checkbox" name="chec" id="chec">
        <label for="chec">Desejo receber novidades e ofertas por email.</label>
        <br><br>

        <button type="submit">Enviar</button>
    </form>
</body>

</html>
